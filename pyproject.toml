[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "bump-my-version>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "black>26",
    "isort>8",
    "jupyterlab>=4.6",
]

[project]
name = "agentic-sql-data-exploration"
version = "0.1.0"
description = "Proof of concept for agentic data exploration with a chatbot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "streamlit>=1.44.0",
    "httpx>=0.28.0",
    "langchain>=0.3.0",
    "langchain-deepseek>=0.1.0",
    "langchain-ollama>=0.2.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "duckdb>=1.5.0",
    "pandas",
    "matplotlib",
    "sqlglot>=30.15.0",
]

[tool.bumpversion]
current_version = "0.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = true
sign_tags = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"
force_single_line = true
include_trailing_comma = true

[tool.uv]
